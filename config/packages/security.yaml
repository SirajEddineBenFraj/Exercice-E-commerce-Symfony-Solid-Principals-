security:
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'

    # Users are loaded from the database by their email.
    providers:
        app_user_provider:
            entity:
                class: App\Entity\User
                property: email

    # SOLID (Open/Closed): SUPER_ADMIN gets every ADMIN right by configuration,
    # no "if admin or super admin" checks have to be edited anywhere in the code.
    role_hierarchy:
        ROLE_ADMIN: ROLE_USER
        ROLE_SUPER_ADMIN: ROLE_ADMIN

    firewalls:
        dev:
            pattern: ^/(_profiler(/|$)|(_wdt|assets|build)/)
            security: false
        main:
            lazy: true
            provider: app_user_provider
            form_login:
                login_path: app_login
                check_path: app_login
                enable_csrf: true
                default_target_path: app_home
            logout:
                path: /logout
                target: app_home

    # First line of defence by URL; controllers also carry #[IsGranted] (defence in depth).
    access_control:
        - { path: ^(/en)?/admin/super, roles: ROLE_SUPER_ADMIN }
        - { path: ^(/en)?/admin, roles: ROLE_ADMIN }
        - { path: ^(/en)?/(account|cart), roles: ROLE_USER }

when@test:
    security:
        password_hashers:
            Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
                algorithm: auto
                cost: 4
                time_cost: 3
                memory_cost: 10
